[package]
name = "blaze-bpe"
version = "0.1.0"
edition = "2021"
description = "Fast tiktoken-compatible BPE tokenizer"
license = "MIT"

[dependencies]
rustc-hash = "2"
rayon = "1.10"
aho-corasick = "1"
base64 = "0.22"
smallvec = "1"
unicode-general-category = "1"

[dev-dependencies]
tiktoken-rs = "0.6"
criterion = "0.5"
bpe-openai = "0.3.0"
fastokens = "0.2.1"
serde_json = "1.0.150"

[[bench]]
name = "encode"
harness = false

[profile.release]
lto = "fat"
codegen-units = 1

[profile.bench]
lto = "fat"
codegen-units = 1
